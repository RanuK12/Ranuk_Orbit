<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Ranuk Orbit</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #00d4ff;
            margin: 0;
            line-height: 1;
        }
        .message {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: #fff;
        }
        .description {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #00d4ff;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #00a8cc;
            transform: translateY(-2px);
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <i class="fas fa-satellite icon"></i>
        <h1 class="error-code">404</h1>
        <h2 class="message">Página no encontrada</h2>
        <p class="description">
            Lo sentimos, la página que buscas no existe o ha sido movida.<br>
            Regresa al inicio o explora nuestro contenido.
        </p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
